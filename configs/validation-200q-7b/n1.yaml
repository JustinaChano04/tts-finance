model:
  name: "mlx-community/Qwen2.5-7B-Instruct-4bit"
  backend: mlx
  temperature: 0.7
  max_new_tokens: 512

dataset:
  name: finqa
  split: validation
  max_examples: 200

strategy:
  name: sampling
  num_samples: 1

verifier:
  timeout_seconds: 5
  tolerance: 0.01
  match_mode: percent_scale

output:
  results_dir: results/
  run_group: validation-200q-7b
