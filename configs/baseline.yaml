model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  device: "auto"
  dtype: "auto"
  temperature: 0.7
  max_new_tokens: 512

dataset:
  name: finqa
  split: validation
  max_examples: 20

strategy:
  name: sampling
  num_samples: 4

verifier:
  timeout_seconds: 5
  tolerance: 0.01

output:
  results_dir: results/
